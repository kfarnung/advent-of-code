name: Advent of Code 2020

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/2020.yml
      - 2020/**
  pull_request:
    paths:
      - .github/workflows/2020.yml
      - 2020/**

jobs:
  build-2020:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "2020"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.27

      - name: Build
        run: go build -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: "2020"

      - name: Test
        run: go test -v ./...
