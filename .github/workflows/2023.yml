name: Advent of Code 2023

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/2023.yml
      - 2023/**
  pull_request:
    paths:
      - .github/workflows/2023.yml
      - 2023/**

jobs:
  build-2023:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "2023"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build
